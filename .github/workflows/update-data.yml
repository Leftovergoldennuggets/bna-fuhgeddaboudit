# =============================================================================
# update-data.yml — Automated weekly data refresh
# =============================================================================
# Downloads the latest NHTSA + Waymo crash data, runs the processing
# pipeline, and commits any updated JSON files to the repository.
#
# Triggers:
#   - Manual: "Run workflow" in the Actions tab
#   - Scheduled: every Monday at 10:00 UTC. NHTSA refreshes its SGO file
#     roughly monthly and Waymo publishes quarterly (~Mar/Jun/Sep/Dec 15),
#     so a weekly run picks up any release within a week with no manual
#     URL updates (the pipeline auto-detects the latest Waymo quarter).
#
# What gets committed:
#   - data/web/*.json    (site statistics, crash data, serious incidents,
#                         geocode cache)
#   - data/static/*.json (miles_by_city.json regenerated from Waymo CSV1)
#
# If nothing changed, no commit is created.
# =============================================================================

name: Update Crash Data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      # Run the unit tests first — never publish data from broken code.
      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Run data pipeline
        run: python pipeline/run_pipeline.py

      # Sanity-check the generated JSON before committing: the site should
      # never go backwards (fewer crashes than the last release) or empty.
      - name: Validate generated data
        run: |
          python - <<'EOF'
          import json, sys

          with open("data/web/site-data.json") as f:
              stats = json.load(f)
          with open("data/web/crash_data.json") as f:
              crashes = json.load(f)

          total = stats["overview"]["total_crashes"]
          assert total > 1000, f"Suspiciously low crash count: {total}"
          assert len(crashes) >= total, "crash_data.json smaller than headline count"
          assert stats["meta"]["federal_data_through"] >= 202604, "Date range went backwards"
          print(f"OK: {total} driverless crashes through "
                f"{stats['meta']['federal_data_through_label']}")
          EOF

      - name: Check for data changes
        id: check-changes
        run: |
          git add data/web/ data/static/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes detected — skipping commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Data changes detected — will commit."
          fi

      - name: Commit and push updated data
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          THROUGH=$(python -c "import json; print(json.load(open('data/web/site-data.json'))['meta']['federal_data_through_label'])")
          git commit -m "Auto-update: refresh crash data (federal data through ${THROUGH})"
          # Rebase in case anything landed on main while the pipeline ran
          git pull --rebase origin main
          git push

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Data update summary"
            python - <<'EOF'
          import json
          with open("data/web/site-data.json") as f:
              s = json.load(f)
          o, m = s["overview"], s["meta"]
          print(f"- Driverless crashes: **{o['total_crashes']}**")
          print(f"- Supervised-testing crashes: {o['supervised_crashes']}")
          print(f"- Awaiting Waymo hub enrichment: {o['preliminary_count']}")
          print(f"- Federal data through: **{m['federal_data_through_label']}**")
          print(f"- Waymo hub data through: {m['hub_data_through_label']}")
          print(f"- Metros with crashes: {o['cities_count']}")
          EOF
          } >> "$GITHUB_STEP_SUMMARY"
